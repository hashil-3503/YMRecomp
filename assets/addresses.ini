# Where YM's tools send things, and the pages they link to: the one place to edit when a service moves.
# Read by YM-builder (into a game folder's YM_version.txt, where the game and `YM-builder perf-report`
# read it). A key left out or empty turns that use off: nothing is sent, and what was waiting stays for next time.
[addresses]
# YM-api's telemetry (/telemetry/crash): POST a crash report (the crash window's Report automatically), kept where only the team reads it
crash_reports =
# YM-api's telemetry (/telemetry/perf): POST a performance summary (the launcher's Send performance statistics)
perf_reports =
